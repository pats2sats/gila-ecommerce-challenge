services:
  db:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: commerce
      POSTGRES_PASSWORD: commerce_local
      POSTGRES_DB: commerce
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U commerce -d commerce"]
      interval: 2s
      timeout: 3s
      retries: 30
    volumes:
      - catalog:/var/lib/postgresql/data
  app:
    build: .
    environment:
      DATABASE_URL: postgres://commerce:commerce_local@db:5432/commerce
      HOST: 0.0.0.0
    depends_on:
      db:
        condition: service_healthy
    ports:
      - "127.0.0.1:3000:3000"
volumes:
  catalog:
